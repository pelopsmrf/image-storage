<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка изображения — Сервер картинок</title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script>document.documentElement.classList.add('js');</script>
</head>

<body>
    <section class="upload__intro">
        <h2 class="upload__title"><a class="upload__home" href="/">Загрузка изображений</a></h2>
        <p class="upload__description">Загружайте фотографии, мемы и любые картинки.</p>
    </section>
    <nav class="upload__tabs">
        <a class="upload__tab upload__tab--active" href="/upload">Загрузка</a>
        <a class="upload__tab" href="/images/">Изображения</a>
    </nav>
    <form class="upload__form" id="upload-form" action="/upload" method="post" enctype="multipart/form-data">
        <div class="upload__dropzone">
            <div class="upload__icon">
                <img src="/static/img/icon/upload-cloud.png" alt="">
            </div>
            <p class="upload__promt">Выберите файл или перетащите его сюда</p>
            <p class="upload__info">Поддерживаются только .jpg, .png и .gif. <br>
                Максимальный размер файла — 5 МБ</p>
        </div>
        <div class="upload__button">
            <input class="upload__file-input" type="file" id="file-upload" name="file"
                accept=".jpg,.png,.gif,image/jpeg,image/png,image/gif" required>
            <label for="file-upload" class="upload__button-btn">Выбрать файл</label>
            <button class="upload__button-btn upload__submit" type="submit">Загрузить</button>
        </div>
        <p class="upload__message $message_class" id="upload-message" role="status">$message</p>
    </form>
    <div class="upload__container">
        <div class="upload__group">
            <h2 class="upload__title-current">Текущая загрузка</h2>
            <div class="upload__label">
                <input type="text" class="upload__input" id="current-url" placeholder="https://" value="$current_url"
                    aria-label="Ссылка на загруженное изображение" readonly>
                <button class="upload__copy" id="copy-button" type="button" $copy_disabled>COPY</button>
            </div>
        </div>
    </div>
    <script src="/static/js/upload.js"></script>
</body>

</html>
