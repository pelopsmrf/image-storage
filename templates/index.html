<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервер картинок</title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="page-home">
    <header>
        <div class="header">
            <h1 class="header__title">Добро пожаловать на сервер картинок</h1>
            <p class="header__text">Загружайте фотографии, мемы и любые картинки в форматах JPG, PNG и GIF
                до 5 МБ и получайте прямые ссылки, которыми можно делиться где угодно.</p>
        </div>
        <nav class="header__button">
            <a class="header__button-btn" href="/upload">Загрузить</a>
            <a class="header__button-btn header__button-btn--outline" href="/images/">Каталог</a>
        </nav>
    </header>
    <main>
        <div class="hero">
            <div class="hero__img is-visible">
                <img class="img" src="/static/img/hero/$hero_image" alt="Пример изображения">
            </div>
        </div>
    </main>
</body>

</html>
