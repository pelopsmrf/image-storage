server {
    listen 80;
    server_name _;

    client_max_body_size 6m;

    # The catalog is generated by FastAPI; individual image files stay on Nginx.
    location = /images/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /images/ {
        alias /images/;
        autoindex off;
    }

    # CSS, JS and page images from the project's static/ folder.
    location /static/ {
        alias /static/;
        autoindex off;
        expires 1h;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
