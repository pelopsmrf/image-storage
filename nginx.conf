server {
    listen 80;
    server_name _;

    client_max_body_size 6m;
    # Относительные редиректы, иначе Nginx подставит внутренний порт 80 вместо 8080
    absolute_redirect off;

    # Список изображений строит FastAPI (/images-list), а сами файлы /images/<имя> отдаёт Nginx
    location = /images/ {
        return 301 /images-list;
    }

    location /images/ {
        alias /images/;
        autoindex off;
    }

    location /static/ {
        alias /static/;
        autoindex off;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
